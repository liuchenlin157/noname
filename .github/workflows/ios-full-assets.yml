name: Build iOS IPA with full assets

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '源码分支或提交；默认对应正式版 v1.11.6.1'
        required: true
        default: '0b7e4be4b6ef64ab8579b2ffc643a2a626e4fede'
        type: string

permissions:
  contents: read

concurrency:
  group: ios-full-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: 完整素材未签名 IPA
    runs-on: macos-26
    timeout-minutes: 120
    env:
      NONAME_BUILD_CHANNEL: release

    steps:
      - name: 拉取 fork 中指定版本的源码
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false

      - name: 记录源码版本及构建环境
        shell: bash
        run: |
          set -euo pipefail
          echo "NONAME_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "NONAME_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          xcodebuild -version
          df -h .

      - name: 安装 pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: 安装锁定版本的依赖
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: 构建游戏与完整素材
        run: pnpm build

      - name: 同步 iOS 资源（不执行素材裁剪脚本）
        working-directory: apps/mobile
        run: pnpm sync:ios

      - name: 核对素材同步完整性并保存摘要清单
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/noname-deliverables"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          source = Path('dist')
          bundled = Path('apps/mobile/native/ios/App/App/public')
          manifest = {}
          groups = {}
          def sha256(path):
              """计算资源摘要；path 为待校验的源文件或同步后的文件。"""
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()
          for group in ('image/character', 'audio/skill', 'audio/die'):
              files = [p for p in (source / group).rglob('*') if p.is_file()]
              assert len(files) > 100, f'素材目录异常：{group}，文件数 {len(files)}'
              groups[group] = len(files)
              for path in files:
                  relative = path.relative_to(source).as_posix()
                  expected = sha256(path)
                  assert (bundled / relative).is_file(), f'同步遗漏：{relative}'
                  assert sha256(bundled / relative) == expected, f'同步内容不一致：{relative}'
                  manifest[relative] = expected
          output = Path(os.environ['RUNNER_TEMP']) / 'noname-deliverables'
          (output / 'asset-manifest-sha256.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2))
          metadata = {'source_repository': os.environ['GITHUB_REPOSITORY'],
                      'upstream_repository': 'libnoname/noname',
                      'source_commit': os.environ['NONAME_BUILD_COMMIT'],
                      'built_at': os.environ['NONAME_BUILD_TIME'], 'asset_counts': groups,
                      'asset_files': len(manifest), 'signed': False}
          (output / 'build-info.json').write_text(json.dumps(metadata, ensure_ascii=False, indent=2))
          print(json.dumps(metadata, ensure_ascii=False, indent=2))
          PY

      - name: 缓存 Swift Package Manager 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ runner.temp }}/SourcePackages
          key: noname-ios-full-spm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/native/ios/App/CapApp-SPM/Package.swift') }}
          restore-keys: noname-ios-full-spm-${{ runner.os }}-

      - name: 使用 Xcode 编译未签名 iOS App
        working-directory: apps/mobile/native/ios/App
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGN_ENTITLEMENTS='' \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=YES ARCHS=arm64 EXCLUDED_ARCHS='i386 x86_64' \
            DEBUG_INFORMATION_FORMAT=dwarf GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            COPY_PHASE_STRIP=YES STRIP_INSTALLED_PRODUCT=YES \
            -quiet build 2>&1 | tee "$RUNNER_TEMP/noname-xcode.log"

      - name: 组装保留完整素材的 IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa-build/Payload"
          ditto "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/App.app" "$RUNNER_TEMP/ipa-build/Payload/App.app"
          cd "$RUNNER_TEMP/ipa-build"
          zip -qry "$RUNNER_TEMP/noname-deliverables/noname-ios-full-assets.ipa" Payload -x '*.DS_Store' -x '*/._*'

      - name: 校验 IPA 内每一份立绘与配音并生成校验文件
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'noname-deliverables'
          manifest = json.loads((output / 'asset-manifest-sha256.json').read_text())
          with zipfile.ZipFile(output / 'noname-ios-full-assets.ipa') as archive:
              for relative, expected in manifest.items():
                  name = 'Payload/App.app/public/' + relative
                  digest = hashlib.sha256()
                  with archive.open(name) as stream:
                      for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                          digest.update(chunk)
                  assert digest.hexdigest() == expected, f'IPA 素材摘要不一致：{relative}'
          metadata = json.loads((output / 'build-info.json').read_text())
          metadata['ipa_asset_verification'] = 'passed'
          (output / 'build-info.json').write_text(json.dumps(metadata, ensure_ascii=False, indent=2))
          print(f'完整素材验证通过：{len(manifest)} 个文件')
          PY
          cd "$RUNNER_TEMP/noname-deliverables"
          shasum -a 256 noname-ios-full-assets.ipa > noname-ios-full-assets.ipa.sha256
          ls -lh

      - name: 上传 IPA、资源摘要和构建记录
        uses: actions/upload-artifact@v4
        with:
          name: noname-ios-full-assets-${{ github.run_number }}
          path: ${{ runner.temp }}/noname-deliverables/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: 失败时保留 Xcode 日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: noname-ios-full-assets-failure-${{ github.run_number }}
          path: ${{ runner.temp }}/noname-xcode.log
          retention-days: 7
          if-no-files-found: ignore
